// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Repositório Maven do PlugPag (PagBank) — biblioteca de integração
        // Bluetooth com a Moderninha Pro/Wifi. A versão 4.x reconhece nomes
        // de aparelho mais novos (ex: prefixo "P2_" da Moderninha Pro 2) —
        // a 3.x só reconhecia PRO-/W-/W+-/PLUS-/MCHIP-.
        maven { url 'https://github.com/pagseguromaster/plugpag/raw/master/4.x/android' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
